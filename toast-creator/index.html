<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سبزلرن - توست ساز پیشرفته</title>
    <link rel="stylesheet" href="./public/css/styles.css" />
    <!-- Fontawesome cdnjs 6.6.0 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>
  <body>
    <h1>توست ساز پیشرفته سبزلرن</h1>

    <div class="buttons">
      <button data-type="success" class="button success">تائید</button>
      <button data-type="warning" class="button warning">هشدار</button>
      <button data-type="info" class="button info">اطلاع</button>
      <button data-type="danger" class="button danger">اخطار</button>
    </div>

    <!-- Toast -->
    <div class="toast" style="display: none">
      <div class="toast-content">
        <div class="toast-icon">
          <!-- Icon-->
        </div>
        <p class="toast-message"><!--text--></p>
      </div>

      <div class="proccess-bar">
        <div class="proccess"></div>
      </div>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
