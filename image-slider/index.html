<!DOCTYPE html>

    <div class="carousel-container">

        <button class="prev">

            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-6"
          >
            <path
              d="M5.055 7.06C3.805 6.347 2.25 7.25 2.25 8.69v8.122c0 1.44 1.555 2.343 2.805 1.628L12 14.471v2.34c0 1.44 1.555 2.343 2.805 1.628l7.108-4.061c1.26-.72 1.26-2.536 0-3.256l-7.108-4.061C13.555 6.346 12 7.249 12 8.689v2.34L5.055 7.061Z"

      </div>
      <img
        src="./public/images/carousel-1.svg"
        class="slider-item active"
        alt="image"
      />
      <img
        src="./public/images/carousel-2.svg"
        class="slider-item"
        alt="image"
      />
      <img
        src="./public/images/carousel-3.svg"
        class="slider-item"
        alt="image"
      />
      <img
        src="./public/images/carousel-4.svg"
        class="slider-item"
        alt="image"
      />
      <img
        src="./public/images/carousel-5.svg"
        class="slider-item"
        alt="image"
      />

      <div class="btn-container right-4">
        <button class="next">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-6"
          >
            <path
              d="M5.055 7.06C3.805 6.347 2.25 7.25 2.25 8.69v8.122c0 1.44 1.555 2.343 2.805 1.628L12 14.471v2.34c0 1.44 1.555 2.343 2.805 1.628l7.108-4.061c1.26-.72 1.26-2.536 0-3.256l-7.108-4.061C13.555 6.346 12 7.249 12 8.689v2.34L5.055 7.061Z"
            />
          </svg>
        </button>
      </div>

      <div class="pagination">
        <div class="page active"></div>
        <div class="page"></div>
        <div class="page"></div>
        <div class="page"></div>
        <div class="page"></div>
